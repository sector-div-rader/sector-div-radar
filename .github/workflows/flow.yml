name: Update intraday flow

on:
  schedule:
    - cron: "0 * * * *"        # 每小時一次，按需要改
  workflow_dispatch:

permissions:
  contents: write              # 只畀 commit 權限

concurrency:
  group: intraday-flow
  cancel-in-progress: false    # 避免兩個 job 同時 push

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday flow
        env:
          LONGBRIDGE_CLIENT_ID: ${{ secrets.LONGBRIDGE_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_REGION: hk
        run: python scripts/intraday_flow.py

       #如果你有 build_site.py / backtest.py，照以下格式加：
      - name: Run backtest
        run: python backtest.py
      
      - name: Build site
        run: python build_site.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flow dashboard_data.json history.csv backtest_results.json intraday.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update intraday flow $(date -u +'%Y-%m-%dT%H:%M')"
          git push
