  intraday:
    needs: flow
    runs-on: ubuntu-latest
    timeout-minutes: 3  # 👈 保險：3 分鐘一定強制斷開，唔會再卡
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests  # 👈 只用 requests，唔使裝 SDK

      - name: Run intraday flow scraper
        env:
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
        run: python scripts/intraday_flow.py

      - name: Commit and push
        run: |
          git config user.name 'flow-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/flow/intraday.json
          git diff --staged --quiet || git commit -m "Update intraday flow $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
