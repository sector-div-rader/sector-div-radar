name: scan
on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests
      - run: python radar.py
        env:
          PHONE: ${{ secrets.PHONE }}
          APIKEY: ${{ secrets.APIKEY }}
