name: daily-radar

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = HKT 06:00
    - cron: '0 13 * * *'   # UTC 13:00 = HKT 21:00
  workflow_dispatch:

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py
        run: python main.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  
      - name: Run backtest.py (每 2 個月跑一次)
        run: |
          HKT_MONTH=$(TZ='Asia/Hong_Kong' date +%m)
          if [ "$HKT_MONTH" = "01" ] || [ "$HKT_MONTH" = "03" ] || [ "$HKT_MONTH" = "05" ] || [ "$HKT_MONTH" = "07" ] || [ "$HKT_MONTH" = "09" ] || [ "$HKT_MONTH" = "11" ]; then
            echo "=== 開始跑 backtest.py (HKT 月: $HKT_MONTH) ==="
            python backtest.py
          else
            echo "=== 今個月唔跑 backtest.py (HKT 月: $HKT_MONTH) ==="
          fi

      - name: Build Dashboard
        run: python build_site.py

      - name: 保存 history.csv + index.html + dashboard_data.json + backtest_results.json
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@bot.com"
          git add history.csv index.html dashboard_data.json
          git add backtest_results.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "冇變更，跳過 commit"
          else
            git commit -m "update V20.0 ${{ github.run_number }}"
            git push
          fi
